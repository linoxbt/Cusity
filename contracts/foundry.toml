[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
via_ir = true          # avoids stack-too-deep in register / finalizeAudit
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read", path = "../build" }, { access = "read", path = "../data" }, { access = "read", path = "../web/public" }, { access = "read-write", path = "../build/tmp" }]

[fuzz]
runs = 256

[rpc_endpoints]
xlayer = "${XLAYER_RPC}"
